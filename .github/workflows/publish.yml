name: Publish

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - run: npm run build

      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      # the version is only staged here; approve it with 2FA: `npm stage list` / `npm stage approve <id>`
      # prerelease versions (1.0.0-rc.1) go to the "next" dist-tag, not "latest"
      - run: |
          case "${GITHUB_REF_NAME#v}" in
            *-*) npm stage publish --tag next ;;
            *)   npm stage publish ;;
          esac
