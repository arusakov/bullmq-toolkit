name: Test

on:
  push:
    branches:
      - "*"
    tags-ignore:
      - "*"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        ioredis: ['5.9', '6']
        redis: ['8.0', '8.2', '8']
        include:
          - node: 26
            ioredis: '6'
            redis: '8'
            coverage: true

    runs-on: ubuntu-latest
    container: node:${{ matrix.node }}-alpine
    services:
      redis:
        image: redis:${{ matrix.redis }}-alpine
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - run: npm i --no-save ioredis@${{ matrix.ioredis }}

      - run: npm run compile

      - run: echo "COVERAGE=${{ matrix.coverage || false }}" >> "$GITHUB_ENV"

      - if: env.COVERAGE == 'true'
        run: npm run test:coverage
        env:
          REDIS_HOST: redis
          REDIS_PORT: 6379

      - if: env.COVERAGE != 'true'
        run: npm run test:all
        env:
          REDIS_HOST: redis
          REDIS_PORT: 6379

      - if: env.COVERAGE == 'true'
        run: apk add git curl gnupg coreutils

      - if: env.COVERAGE == 'true'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          file: ./coverage/lcov.info
          os: alpine
          token: ${{ secrets.CODECOV_TOKEN }}
